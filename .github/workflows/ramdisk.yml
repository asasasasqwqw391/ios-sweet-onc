name: ramdisk

# Build a minimal raw HFS+ root volume for the onc XNU port (md0 ramdisk root)
# with a minimal arm64 Mach-O /sbin/launchd.
#
# launchd is built from C with the Apple toolchain (`clang -c` + `ld -static`),
# ad-hoc signed, and only issues Darwin arm64 syscalls (svc #0x80):
#   1. write(1, "ONC USERLAND\n", 14)
#   2. open("/dev/console", O_WRONLY) -> if fd >= 0: write(fd, "ONC CONSOLE OK\n")
#      then exit(200); otherwise exit(100 + ret_of_write_1)
# The exit status shows up in the kernel's "initproc failed to start ...
# exit status N" panic, which tells us what the syscalls returned.
#
# Fallbacks (in order): ld-static from start.S (previous), hand-built Mach-O v2.
# Runs only on its own file / manual dispatch, so it never triggers kernel builds.

on:
  push:
    paths:
      - ".github/workflows/ramdisk.yml"
  workflow_dispatch:

jobs:
  mkramdisk:
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build minimal HFS+ root image + /sbin/launchd
        run: |
          cat > mkramdisk.sh <<'SH'
          set -x
          rm -rf root mnt root.img root.dmg launchd launchd_* start.c start.S start.o
          mkdir -p root/dev root/private/var/tmp root/private/var/mobile root/private/var/root \
                   root/System/Library root/usr/lib root/usr/bin root/bin root/sbin root/tmp \
                   root/cores root/etc root/private/etc
          chmod 1777 root/tmp root/private/var/tmp

          # ---- launchd C source (freestanding, raw svc #0x80 syscalls) ------
          cat > start.c <<'CSRC'
          typedef long isize;
          static inline long
          onc_syscall(long n, long a, long b, long c)
          {
              register long x0 __asm__("x0") = a;
              register long x1 __asm__("x1") = b;
              register long x2 __asm__("x2") = c;
              register long x16 __asm__("x16") = n;
              __asm__ volatile("svc #0x80"
                  : "+r"(x0) : "r"(x1), "r"(x2), "r"(x16) : "memory", "cc");
              return x0;
          }
          #define SYS_exit  1
          #define SYS_read  3
          #define SYS_write 4
          #define SYS_open  5

          static const char msg1[] = "ONC USERLAND\n";
          static const char msg2[] = "ONC CONSOLE OK\n";
          static const char cpath[] = "/dev/console";

          void
          start(void)
          {
              char c;
              long r1 = onc_syscall(SYS_write, 1, (long)msg1, sizeof(msg1) - 1);
              long fd = onc_syscall(SYS_open, (long)cpath, 1 /* O_WRONLY */, 0);
              (void)r1;
              if (fd >= 0) {
                  (void)onc_syscall(SYS_write, fd, (long)msg2, sizeof(msg2) - 1);
              }
              /* Stay resident: exiting makes the kernel panic on init exit
               * ("initproc failed to start"). Block on console reads, or spin
               * in userland when there is no usable console fd. */
              for (;;) {
                  if (fd >= 0) {
                      (void)onc_syscall(SYS_read, fd, (long)&c, 1);
                  }
              }
          }
          CSRC
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK=$SDK"
          xcrun --sdk iphoneos clang -target arm64-apple-ios14.0 -O1 -ffreestanding \
              -fno-builtin -fno-stack-protector -c start.c -o start.o
          echo "compile rc=$?"
          ls -l start.o || true

          ld -arch arm64 -static -e _start -o launchd_c start.o
          echo "ld-static C rc=$?"

          # fallback A: ld-static from assembly (previous working build)
          cat > start.S <<'ASM'
              .section __TEXT,__text,regular,pure_instructions
              .globl _start
          _start:
              mov     x0, #1
              adrp    x1, msg@PAGE
              add     x1, x1, msg@PAGEOFF
              mov     x2, #14
              mov     x16, #4
              svc     #0x80
              mov     x0, #0
              mov     x16, #1
              svc     #0x80
          1:  b       1b
              .section __TEXT,__cstring,cstring_literals
          msg: .ascii "ONC USERLAND\n"
          ASM
          xcrun --sdk iphoneos clang -target arm64-apple-ios14.0 -c start.S -o start_asm.o
          ld -arch arm64 -static -e _start -o launchd_asm start_asm.o
          echo "ld-static asm rc=$?"
          # fallback B: hand-built Mach-O v2 from the repo
          cp ramdisk/launchd.bin launchd_handbuilt

          launchd=""
          for cand in launchd_c launchd_asm launchd_handbuilt; do
            [ -f "$cand" ] || continue
            echo "== candidate $cand"
            file "$cand"
            otool -h "$cand" 2>&1 | head -6 || true
            if codesign --force -s - "$cand"; then
              codesign -dvvv "$cand" 2>&1 | head -8 || true
              launchd="$cand"
              echo "CHOSEN $cand"
              break
            else
              echo "codesign failed for $cand"
            fi
          done
          [ -n "$launchd" ] || { echo "NO USABLE launchd"; exit 1; }
          cp "$launchd" root/sbin/launchd
          chmod 755 root/sbin/launchd

          # ---- HFS+ volume in a writable device image ----------------------
          hdiutil create -size 8m -fs HFS+ -volname root -layout NONE root.dmg
          mkdir -p mnt
          hdiutil attach -readwrite -mountpoint "$PWD/mnt" root.dmg
          cp -a root/. mnt/
          sync
          hdiutil detach mnt
          # ---- read the raw volume bytes back out of the device ------------
          DEV=$(hdiutil attach -nomount root.dmg | head -1 | awk '{print $1}')
          echo "DEV=[$DEV]"
          sudo dd if="$DEV" of=root.img bs=1m
          hdiutil detach "$DEV" || true
          ls -l root.img
          shasum -a 256 root.img
          SH
          bash -x mkramdisk.sh > build.log 2>&1
          rc=$?
          cat build.log
          ls -l root.img launchd launchd_* 2>/dev/null || true
          exit $rc

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ramdisk-log
          path: build.log
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: hfs-root
          path: root.img
          retention-days: 30
