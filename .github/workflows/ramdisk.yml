name: ramdisk

# Build a minimal raw HFS+ root volume for the onc XNU port (md0 ramdisk root).
# Runs only on its own file / manual dispatch, so it never triggers kernel builds.
# The step's full output is uploaded as the `ramdisk-log` artifact even on
# failure (job logs need repo admin rights we do not have through the tunnel).

on:
  push:
    paths:
      - ".github/workflows/ramdisk.yml"
  workflow_dispatch:

jobs:
  mkramdisk:
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build minimal HFS+ root image
        run: |
          cat > mkramdisk.sh <<'SH'
          set -x
          rm -rf root mnt root.img root.dmg
          mkdir -p root/dev root/private/var/tmp root/private/var/mobile root/private/var/root \
                   root/System/Library root/usr/lib root/usr/bin root/bin root/sbin root/tmp \
                   root/cores root/etc root/private/etc
          chmod 1777 root/tmp root/private/var/tmp

          # 1) HFS+ volume in a writable device image
          hdiutil create -size 8m -fs HFS+ -volname root -layout NONE root.dmg
          # 2) mount it read-write (UDRW is writable) and populate the skeleton
          mkdir -p mnt
          hdiutil attach -readwrite -mountpoint "$PWD/mnt" root.dmg
          cp -a root/. mnt/
          sync
          hdiutil detach mnt
          # 3) read the raw volume bytes back out of the device
          DEV=$(hdiutil attach -nomount root.dmg | head -1 | awk '{print $1}')
          echo "DEV=[$DEV]"
          sudo dd if="$DEV" of=root.img bs=1m
          hdiutil detach "$DEV" || true
          ls -l root.img
          shasum -a 256 root.img
          SH
          bash -x mkramdisk.sh > build.log 2>&1
          rc=$?
          cat build.log
          ls -l root.img || true
          exit $rc

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ramdisk-log
          path: build.log
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: hfs-root
          path: root.img
          retention-days: 30
